<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>作物・害虫・症状・薬剤 検索UI（pest_data.csv）</title>
<style>
  :root { --c-muted:#666; --c-border:#ddd; --c-chip-bg:#eef; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; line-height: 1.6; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: end; }
  label { display:block; font-weight:600; margin-bottom:4px; }
  .field { display: grid; gap: 6px; }            /* コンテナ（中に input と select） */
  .field input[type="text"], .field select { 
    width: 100%;                                  /* 同一幅 */
    padding: 8px; 
    font-size: 14px; 
  }
  /* もしテキストだけプルダウン「以下」の幅にしたければ、下記の max-width を活用（例：95%） */
　 .field input[type="text"] { max-width: 89%; } 

  .row { margin-top: 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color: var(--c-muted); font-size: 12px; }
  button { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .result { margin-top: 16px; }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--c-border); vertical-align: top; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; background: var(--c-chip-bg); margin-right: 4px; font-size: 12px; }
  .count { font-weight:600; }


input[type="text"] {
  font-size: 12px;       /* お好みで 12〜14px 程度 */
  line-height: 1.4;      /* 文字詰まり防止（任意） */
}


/* 各ブラウザ向けに placeholder のサイズを調整 */
.field input::placeholder {            /* 標準 */
  font-size: 0.85em;                   /* 入力文字より少し小さめに（任意） */
  opacity: 0.7;                        /* 視認性調整（任意） */
}
.field input::-webkit-input-placeholder { font-size: 0.85em; }
.field input::-moz-placeholder            { font-size: 0.85em; }
.field input:-ms-input-placeholder        { font-size: 0.85em; }


  
</style>
</head>
<body>
<div class="wrap">
  <h1>園芸データ検索（作物・害虫・症状・薬剤）</h1>
  <p class="muted">/data/pest_data.csv を読み込み、4軸で絞り込み表示します。未選択の軸はワイルドカード扱いです。</p>

  <div class="grid" role="search" aria-label="園芸データ検索フォーム">
    <!-- 作物：テキスト + プルダウン（同幅） -->
    <div class="field">
      <label for="cropText">作物（テキストで候補を絞り込み）</label>
      <input id="cropText" type="text" placeholder="例）ト（トマト／トウモロコシ など）" />
      <select id="cropSelect" aria-label="作物一覧">
        <option value="">（すべて）</option>
      </select>
      <div class="muted">未入力＝全候補。入力すると「前方一致」優先＋「部分一致」も表示。</div>
    </div>

    <!-- 害虫：テキスト + プルダウン（同幅） -->
    <div class="field">
      <label for="pestText">害虫（テキストで候補を絞り込み）</label>
      <input id="pestText" type="text" placeholder="例）あぶ（アブラムシ類）／はだ（ハダニ類）" />
      <select id="pestSelect" aria-label="害虫一覧">
        <option value="">（すべて）</option>
      </select>
      <div class="muted">未入力＝全候補。入力すると「前方一致」優先＋「部分一致」も表示。</div>
    </div>
   
    
    <!-- 症状：テキスト + プルダウン（作物/害虫と同じUI） -->
    <div class="field">
      <label for="symptomText">症状（テキストで候補を絞り込み）</label>
      <!-- ▼ 追加：症状のテキスト入力 -->
      <input id="symptomText" type="text" placeholder="例）黄化／かすれ／ベタつき など" />
    
      <select id="symptomSelect" aria-label="症状一覧">
        <option value="">（すべて）</option>
      </select>
      <div class="muted">未入力＝全候補。入力すると「前方一致」優先＋「部分一致」も表示。</div>
    </div>
    
    <!-- 薬剤：テキストのみ -->
    <div class="field">
      <label for="productInput">薬剤（部分一致）</label>
      <input id="productInput" type="text" placeholder="例）プレオ / モスピラン など" />
    </div>
  </div>

  <div class="row">
    <button id="btnSearch">検索</button>
    <button id="btnClear" type="button">条件クリア</button>
    <span class="muted">Enter キーでも検索できます。</span>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
/** 正規化（全角半角・小文字化） */
const normalize = (s) => (s ?? "")
  .toString()
  .trim()
  .normalize("NFKC")
  .toLowerCase();

/** CSVパース（簡易） */
function parseCSV(csvText) {
  const lines = csvText.replace(/\r/g, "").trim().split("\n");
  const headers = lines.shift().split(",");
  return lines.map(line => {
    const cols = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (cols[i] ?? "").trim());
    return obj;
  });
}

/** 重複なし昇順 */
const uniqSorted = arr => [...new Set(arr)].sort((a,b) => a.localeCompare(b, "ja"));

/** UI参照 */
const cropText      = document.getElementById("cropText");
const cropSelect    = document.getElementById("cropSelect");
const pestText      = document.getElementById("pestText");
const pestSelect    = document.getElementById("pestSelect");
const symptomSelect = document.getElementById("symptomSelect");
const productInput  = document.getElementById("productInput");
const btnSearch     = document.getElementById("btnSearch");
const btnClear      = document.getElementById("btnClear");
const resultEl      = document.getElementById("result");

let RAW = [];       // CSV全行
let ROWS = [];      // 整形済み（薬剤を配列化）
let ALL_CROPS = []; // 作物の全候補（ユニーク）
let ALL_PESTS = []; // 害虫の全候補（ユニーク）

/** セレクトへ流し込み */
function populateSelect(selectEl, items) {
  const current = selectEl.value;
  selectEl.innerHTML = '<option value="">（すべて）</option>' + 
    items.map(v => `<option value="${v}">${v}</option>`).join("");
  if ([...selectEl.options].some(o => o.value === current)) selectEl.value = current;
}

/** セレクト初期化 */
function buildFacets(rows) {
  ALL_CROPS = uniqSorted(rows.map(r => r["作物"]).filter(Boolean));
  ALL_PESTS = uniqSorted(rows.map(r => r["害虫"]).filter(Boolean));
  const symptoms = uniqSorted(rows.map(r => r["症状"]).filter(Boolean));

  populateSelect(cropSelect, ALL_CROPS);
  populateSelect(pestSelect, ALL_PESTS);
  populateSelect(symptomSelect, symptoms);
}

/** 薬剤配列化（読点・カンマ・スラッシュ・空白など） */
function tokenizeProducts(prodStr) {
  return (prodStr || "")
    .split(/[、,，\/／・\s]+/).map(s => s.trim()).filter(Boolean);
}

/** デバウンス */
function debounce(fn, wait=120) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}

/** 入力テキストで候補をフィルタ（前方一致→部分一致） */
function filterOptions(allList, query) {
  const q = normalize(query);
  if (!q) return allList;
  const head = allList.filter(v => normalize(v).startsWith(q));
  const part = allList.filter(v => !normalize(v).startsWith(q) && normalize(v).includes(q));
  return [...head, ...part];
}
const updateCropOptions = debounce(() => {
  populateSelect(cropSelect, filterOptions(ALL_CROPS, cropText.value));
}, 100);
const updatePestOptions = debounce(() => {
  populateSelect(pestSelect, filterOptions(ALL_PESTS, pestText.value));
}, 100);

/** 検索 */
function doSearch() {
  const crop    = cropSelect.value;
  const pest    = pestSelect.value;
  const symptom = symptomSelect.value;
  const pQuery  = normalize(productInput.value);

  let rows = ROWS.filter(r =>
    (!crop    || r.作物  === crop) &&
    (!pest    || r.害虫  === pest) &&
    (!symptom || r.症状  === symptom)
  );

  if (pQuery) {
    rows = rows.filter(r => r._productsNorm.some(p => p.includes(pQuery)));
  }

  renderTable(rows);
}

/** 表示 */
function renderTable(rows) {
  if (!rows.length) {
    resultEl.innerHTML = `<p>該当データがありません。条件を緩めて再検索してください。</p>`;
    return;
  }
  const html = `
    <p><span class="count">${rows.length}</span> 件ヒット</p>
    <table aria-label="検索結果">
      <thead>
        <tr><th>作物</th><th>害虫</th><th>症状</th><th>薬剤（例）</th></tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.作物}</td>
            <td>${r.害虫}</td>
            <td>${r.症状}</td>
            <td>${r._products.map(p => `<span class="chip">${p}</span>`).join(" ")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
  resultEl.innerHTML = html;
}

/** クリア */
function clearFilters() {
  cropText.value = "";
  pestText.value = "";
  cropSelect.value = "";
  pestSelect.value = "";
  symptomSelect.value = "";
  productInput.value = "";
  populateSelect(cropSelect, ALL_CROPS); // 候補リセット
  populateSelect(pestSelect, ALL_PESTS); // 候補リセット
  doSearch();
}

/** 起動 */
(async function init() {
  const res = await fetch("data/pest_data.csv", { cache: "no-store" });
  if (!res.ok) {
    resultEl.innerHTML = `<p>CSVの取得に失敗しました（${res.status}）。配置とパスを確認してください。</p>`;
    return;
  }
  const csvText = await res.text();
  RAW = parseCSV(csvText);

  ROWS = RAW.map(row => {
    const products = tokenizeProducts(row["薬剤"]);
    return {
      ...row,
      _products: products,
      _productsNorm: products.map(p => normalize(p))
    };
  });

  buildFacets(ROWS);
  renderTable(ROWS);

  // イベント（入力→候補更新）
  cropText.addEventListener("input", updateCropOptions);
  pestText.addEventListener("input", updatePestOptions);

  // イベント（変更→検索）
  cropSelect.addEventListener("change", doSearch);
  pestSelect.addEventListener("change", doSearch);
  symptomSelect.addEventListener("change", doSearch);
  btnSearch.addEventListener("click", doSearch);
  btnClear.addEventListener("click", clearFilters);
  productInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
})();
</script>
</body>
</html>
